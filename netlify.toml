# netlify.toml
# Subilo a la raíz de tu repositorio junto con el HTML

[build]
  publish = "."

# Headers globales — mejoran velocidad y seguridad (factores de ranking en Google)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Cache largo para assets estáticos
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirigir /index.html → / (evita contenido duplicado)
[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
  force  = true
